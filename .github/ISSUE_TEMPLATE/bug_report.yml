name: Bug Report
description: Report a bug or unexpected behavior in geokit
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the bug and what you expected to happen.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command executed
      placeholder: "geokit gp clip ./vector --aoi ./aoi.shp --out ./out.gdb"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `geokit doctor` and `geokit --version`
      description: Paste the output here so we know your detected ArcGIS/GDAL environment.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      render: shell
