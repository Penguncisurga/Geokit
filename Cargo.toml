[package]
name = "geokit"
version = "2.6.2"
edition = "2021"
authors = ["Penguncisurga <satriobagusbudianto@gmail.com>"]
description = "Fast GIS CLI & built-in MCP server for spatial data hygiene, batch ArcGIS Pro / ArcMap 10.x / GDAL geoprocessing, layouts, raster terrain, and watershed (DAS) hydrology"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Penguncisurga/Geokit"
keywords = ["gis", "arcgis", "gdal", "mcp", "cli"]
categories = ["command-line-utilities", "science::geo"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
comfy-table = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
toml = "0.8"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
